<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>25-manna live — 2026</title>
<style>
:root{
  --bg:#F7F5F0; --bg-card:#FFFFFF; --text:#20231F; --text-secondary:#5B5F58; --border:#E1DED4;
  --accent:#27500A; --accent-bg:#E5F0DE; --accent-row:#EEF5E8; --warn:#993C1D; --warn-bg:#FAECE7;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#171814; --bg-card:#20231F; --text:#EDEBE3; --text-secondary:#A2A69A; --border:#33362F;
    --accent:#8FD16B; --accent-bg:#233B18; --accent-row:#26331D; --warn:#E08B6B; --warn-bg:#3B241C; }
}
*{box-sizing:border-box;}
body{margin:0;padding:20px 16px 48px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;}
.wrap{max-width:720px;margin:0 auto;}
h1{font-size:19px;font-weight:700;margin:0 0 2px;}
.sub{font-size:12px;color:var(--text-secondary);margin-bottom:16px;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px;}
.stats{display:flex;gap:10px 24px;flex-wrap:wrap;}
.stat-label{font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:2px;}
.stat-value{font-size:24px;font-weight:700;}
.stat-sub{font-size:11px;color:var(--text-secondary);margin-top:1px;}
.now{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.now-label{font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:4px;}
.now-list{font-size:14px;font-weight:600;line-height:1.45;}
.banner{padding:10px 14px;border-radius:12px;font-size:12.5px;margin-bottom:14px;}
.banner.restart,.banner.stale{background:var(--warn-bg);color:var(--warn);}
.grouphdr{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.03em;padding:10px 4px 4px;}
.leg{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--border);}
.leg:last-child{border-bottom:none;}
.leg.cur{background:var(--accent-row);border-radius:10px;border-bottom-color:transparent;box-shadow:inset 3px 0 0 var(--accent);}
.leg-key{width:34px;font-weight:700;font-size:13px;flex-shrink:0;}
.diffpill{font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:20px;flex-shrink:0;}
.leg-main{flex:1;min-width:0;}
.leg-runner{font-size:13.5px;font-weight:500;overflow-wrap:anywhere;}
.leg-meta{font-size:11px;color:var(--text-secondary);}
.leg-right{text-align:right;flex-shrink:0;}
.leg-time{font-size:13px;font-weight:600;white-space:nowrap;}
.leg-sub{margin-top:3px;font-size:10.5px;color:var(--text-secondary);display:flex;gap:6px;justify-content:flex-end;align-items:center;white-space:nowrap;}
.leg-status{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:20px;}
.status-done{background:var(--accent-bg);color:var(--accent);}
.status-eta{background:var(--border);color:var(--text-secondary);}
.status-cur{background:var(--accent);color:var(--bg-card);}
.foot{font-size:11px;color:var(--text-secondary);text-align:center;margin-top:18px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <h1>25-manna — <span id="hYear"></span></h1>

  <div id="root"></div>
</div>

"14:20","finishClock":"15:00","startRange":"14:05–14:35","legTime":null,"isActual":false,"isRestart":false,"isCurrent":false,"splitNote":null,"place":null},{"key":"24","label":"24","group":null,"diff":"Blå","km":6,"runner":"Molly Nordelöf","startClock":"15:00","finishClock":"15:55","startRange":"14:45–15:20","legTime":null,"isActual":false,"isRestart":false,"isCurrent":false,"splitNote":null,"place":null},{"key":"25","label":"25","group":null,"diff":"Blå","km":8,"runner":"Jacob Axenborg","startClock":"15:55","finishClock":"16:50","startRange":"15:35–16:20","legTime":null,"isActual":false,"isRestart":false,"isCurrent":false,"splitNote":null,"place":null}],"generatedAtMs":1791409315669};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const DIFF_COLORS={"Vit":{"bg":"#E8E6DD","fg":"#444441"},"Gul":{"bg":"#FAEEDA","fg":"#633806"},"Orange":{"bg":"#FAECE7","fg":"#993C1D"},"Violett":{"bg":"#EEEDFE","fg":"#3C3489"},"Röd":{"bg":"#FBEAEA","fg":"#96271E"},"Blå":{"bg":"#E6F1FB","fg":"#0C447C"}};
function render(){
  document.getElementById('hYear').textContent=DATA.year;
  const root=document.getElementById('root');
  let html='';
  const ageMin=(Date.now()-DATA.generatedAtMs)/60000;
  if(ageMin>90){
    html+='<div class="banner stale">Den h\u00e4r sidan uppdaterades senast '+esc(DATA.generatedAtLabel)+' \u2014 fr\u00e5ga lagledaren om en f\u00e4rskare version har publicerats.</div>';
  }
  let vs='';
  if(DATA.vsPlanMin!=null){
    const m=DATA.vsPlanMin;
    vs='<div><div class="stat-label">Mot plan</div><div class="stat-value">'+(m===0?'I fas':(m>0?'+':'\u2212')+Math.abs(m)+' min')+'</div><div class="stat-sub">'+(m===0?'med planen':(m>0?'efter':'f\u00f6re')+' plan')+'</div></div>';
  }
  const risk=(DATA.restartRisk||[]).map(r=>'<div><div class="stat-label">Risk omstart</div><div class="stat-value">'+r.pct+' %</div><div class="stat-sub">p\u00e5 str\u00e4cka '+esc(r.leg)+'</div></div>').join('');

    +'<div class="now"><div class="now-label">P\u00e5g\u00e5r just nu</div><div class="now-list">'+(DATA.runningNow.length?DATA.runningNow.map(r=>esc(r.label)+(r.runner?' \u00b7 '+esc(r.runner):'')).join('<br>'):'\u2014')+'</div></div>'

  if(DATA.restartKeys.length){
    html+='<div class="banner restart">Omstart v\u00e4ntas/till\u00e4mpades f\u00f6r str\u00e4ckorna '+esc(DATA.restartKeys.join(', '))+' (start senarelagd till samlingsstarten).</div>';
  }
  html+='<div class="card" style="padding:6px 10px;">';

  DATA.legs.forEach(leg=>{
    if(leg.group&&leg.group!==lastGroup){lastGroup=leg.group;html+='<div class="grouphdr">Str\u00e4cka '+leg.group+'</div>';}
    else if(!leg.group)lastGroup=null;
    const dc=DIFF_COLORS[leg.diff]||DIFF_COLORS['Bl\u00e5'];
    const restartNote=leg.isRestart?' <span title="Omstart \u2014 kortad bana">\u21bb</span>':'';
    const timeLabel=leg.legTime?leg.legTime:(leg.splitNote?'ca '+leg.splitNote.min+' min':leg.finishClock?'ca '+esc(leg.startClock||'')+'\u2013'+esc(leg.finishClock||''):'\u2014');
    const stCls=leg.isActual?'status-done':(leg.isCurrent?'status-cur':'status-eta');
    const stTxt=leg.isActual?'Klar':(leg.isCurrent?'P\u00e5g\u00e5r':'Prognos');
    html+='<div class="leg'+(leg.isCurrent?' cur':'')+'">'
      +'<div class="leg-key">'+esc(leg.label)+restartNote+'</div>'
      +'<div class="diffpill" style="background:'+dc.bg+';color:'+dc.fg+';">'+esc(leg.diff||'')+'</div>'
      +'<div class="leg-main"><div class="leg-runner">'+(leg.runner?esc(leg.runner):'\u2014 ingen tilldelad \u2014')+'</div><div class="leg-meta">'+(leg.startRange?'v\u00e4xling '+esc(leg.startRange):(leg.startClock?'start '+esc(leg.startClock):''))+(leg.km?' \u00b7 '+leg.km+' km':'')+'</div></div>'

      +'<div class="leg-sub">'+(leg.splitNote?'<span>mellantid '+(leg.splitNote.pct>0?'+':leg.splitNote.pct<0?'−':'±')+Math.abs(leg.splitNote.pct)+' % mot täten</span>':'')+(leg.place?'<span>plats '+esc(leg.place)+'</span>':'')+'<span class="leg-status '+stCls+'">'+stTxt+'</span></div></div>'
      +'</div>';
  });
  html+='</div>';
  root.innerHTML=html;
}
render();
</script>
